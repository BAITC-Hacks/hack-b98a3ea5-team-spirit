[project]
name = "hackalem-wind-ml"
version = "0.1.0"
description = "Wind-turbine power model selection for HackAlem"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
